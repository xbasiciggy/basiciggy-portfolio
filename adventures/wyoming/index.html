    .gallery-intro{max-width:1320px;margin:0 auto;padding:46px clamp(12px,2vw,24px) 22px;display:flex;justify-content:space-between;align-items:end;gap:30px}.gallery-intro h2{font-size:clamp(26px,3.6vw,48px);line-height:1;letter-spacing:-.045em;margin:0}.gallery-intro p{max-width:520px;margin:0;color:rgba(255,255,255,.52);font-size:13px;line-height:1.6}
    .gallery-grid{--gm-gutter:.66%;position:relative;max-width:1560px;margin:0 auto;padding:0 clamp(8px,1vw,14px) 94px;min-height:120px}.photo{position:absolute;left:0;top:0;margin:0;min-width:0;overflow:hidden;border-radius:6px;background:#0a0a0a;opacity:0;will-change:transform,opacity;transition:opacity .42s ease,box-shadow .3s ease}.photo.gm-laid-out{opacity:1}.photo-button{appearance:none;border:0;padding:0;margin:0;width:100%;height:100%;display:block;background:#0a0a0a;cursor:zoom-in;overflow:hidden}.photo img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .45s cubic-bezier(.17,.84,.44,1),filter .35s ease}.photo-button:hover img{transform:scale(1.018);filter:brightness(.92)}
    .gallery-footer{max-width:1320px;margin:0 auto;padding:28px clamp(12px,2vw,24px) 80px;border-top:1px solid rgba(255,255,255,.09);display:flex;justify-content:space-between;gap:20px}.gallery-footer a{color:#fff;text-decoration:none;font-size:clamp(20px,2.6vw,38px);letter-spacing:-.035em}.gallery-footer span{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.45;margin-bottom:8px}
    dialog.lightbox{border:0;padding:0;background:rgba(0,0,0,.96);width:100vw;height:100vh;max-width:none;max-height:none;color:#fff}.lightbox::backdrop{background:#000}.lightbox-stage{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:40px}.lightbox img{max-width:100%;max-height:100%;object-fit:contain}.lightbox-close,.lightbox-prev,.lightbox-next{position:absolute;z-index:3;appearance:none;border:0;background:rgba(20,20,20,.62);backdrop-filter:blur(16px);color:white;border:1px solid rgba(255,255,255,.12);width:48px;height:48px;border-radius:999px;font-size:22px;cursor:pointer}.lightbox-close{right:18px;top:18px}.lightbox-prev{left:18px;top:50%}.lightbox-next{right:18px;top:50%}.lightbox-count{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.6}
    @media(max-width:720px){.gallery-nav{padding:16px;grid-template-columns:1fr 1fr}.gallery-nav .brand{display:none}.gallery-hero{height:62vh;min-height:440px}.hero-copy{display:block;left:18px;right:18px;bottom:28px}.hero-title{font-size:clamp(52px,18vw,92px);line-height:.82}.hero-meta{text-align:left;margin-top:16px}.gallery-intro{padding:30px 8px 16px;display:block}.gallery-intro p{margin-top:12px}.gallery-grid{padding:0 6px 64px;--gm-gutter:2.4%}.photo{border-radius:5px}.gallery-footer{padding:24px 10px 54px}.lightbox-stage{padding:18px}.lightbox-prev,.lightbox-next{top:auto;bottom:16px}.lightbox-count{bottom:31px}}

  <script>
  (()=>{
    const grid=document.querySelector('.gallery-grid');
    const figures=[...grid.querySelectorAll('.photo')];
    const columnCount=()=>{
      const w=window.innerWidth;
      if(w<=740)return 2;
      if(w<=940)return 3;
      if(w<=1180)return 4;
      if(w<=1480)return 5;
      return 6;
    };
    const layout=()=>{
      const cols=columnCount();
      const width=grid.clientWidth;
      if(width<80)return;
      const gutterRatio=cols===2?.024:.0066;
      const gutter=Math.max(cols===2?6:5,width*gutterRatio);
      const colWidth=(width-gutter*(cols-1))/cols;
      const heights=new Array(cols).fill(0);
      figures.forEach((figure)=>{
        const image=figure.querySelector('img');
        if(!image.naturalWidth||!image.naturalHeight)return;
        const ratio=image.naturalWidth/image.naturalHeight;
        let span=(ratio>1.38&&cols>=2)?2:1;
        if(ratio>2.35&&cols>=5)span=3;
        span=Math.min(span,cols);
        let bestCol=0,bestY=Number.POSITIVE_INFINITY;
        for(let start=0;start<=cols-span;start++){
          const y=Math.max(...heights.slice(start,start+span));
          if(y<bestY-.5){bestY=y;bestCol=start;}
        }
        const itemWidth=colWidth*span+gutter*(span-1);
        const itemHeight=itemWidth/ratio;
        const x=bestCol*(colWidth+gutter);
        figure.style.width=`${itemWidth}px`;
        figure.style.height=`${itemHeight}px`;
        figure.style.transform=`translate3d(${x}px,${bestY}px,0)`;
        figure.classList.add('gm-laid-out');
        const next=bestY+itemHeight+gutter;
        for(let c=bestCol;c<bestCol+span;c++)heights[c]=next;
      });
      grid.style.height=`${Math.max(0,...heights)-gutter}px`;
    };
    const schedule=()=>requestAnimationFrame(layout);
    figures.forEach(f=>{const img=f.querySelector('img');if(img.complete&&img.naturalWidth)schedule();else img.addEventListener('load',schedule,{once:true})});
    let timer=0;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(layout,90)},{passive:true});
    if('ResizeObserver'in window)new ResizeObserver(()=>{clearTimeout(timer);timer=setTimeout(layout,60)}).observe(grid);
    layout();

    const buttons=[...document.querySelectorAll('.photo-button')],box=document.getElementById('lightbox'),img=box.querySelector('img'),count=box.querySelector('.lightbox-count');let i=0;const show=n=>{i=(n+buttons.length)%buttons.length;img.src=buttons[i].dataset.full;count.textContent=`${String(i+1).padStart(2,'0')} / ${String(buttons.length).padStart(2,'0')}`};buttons.forEach((b,n)=>b.addEventListener('click',()=>{show(n);box.showModal()}));box.querySelector('.lightbox-close').onclick=()=>box.close();box.querySelector('.lightbox-prev').onclick=()=>show(i-1);box.querySelector('.lightbox-next').onclick=()=>show(i+1);document.addEventListener('keydown',e=>{if(!box.open)return;if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1);if(e.key==='Escape')box.close()});let x=0;box.addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});box.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>45)show(i+(d<0?1:-1))},{passive:true});
  })();
  </script>
