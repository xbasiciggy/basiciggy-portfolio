<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Wyoming</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#050807;color:#fff}
    *{box-sizing:border-box}
    html,body{min-height:100%;background:#050807}
    body{margin:0;color:#fff;position:relative;isolation:isolate}
    body::before{
      content:"";position:fixed;z-index:-2;inset:0;pointer-events:none;
      background:
        radial-gradient(110% 80% at 8% -4%,rgba(12,89,71,.48) 0%,rgba(7,42,35,.28) 34%,rgba(5,14,12,.14) 58%,rgba(5,8,7,0) 82%),
        linear-gradient(180deg,#071311 0%,#07100f 38%,#060b0a 68%,#050807 100%);
    }
    body::after{
      content:"";position:fixed;z-index:-1;inset:0;pointer-events:none;
      background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.08) 38%,rgba(0,0,0,.24) 72%,rgba(0,0,0,.34) 100%);
    }
    header{position:sticky;top:0;z-index:4;padding:18px 24px;background:rgba(6,14,13,.66);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.10)}
    header a{color:#fff;text-decoration:none;opacity:.76}
    main{max-width:1500px;margin:auto;padding:72px 28px 100px;background:transparent}
    .eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:12px;opacity:.56;margin-bottom:12px}
    h1{font-size:clamp(48px,8vw,112px);line-height:.9;margin:0 0 18px;letter-spacing:-.055em;font-weight:600}
    .meta{font-size:15px;opacity:.68;margin-bottom:54px}
    .grid{columns:3 320px;column-gap:14px}
    .grid img{width:100%;height:auto;display:block;margin:0 0 14px;border-radius:18px;background:rgba(255,255,255,.035);break-inside:avoid}
    @media(max-width:720px){main{padding:48px 14px 80px}.grid{columns:1}h1{font-size:54px}}
  </style>
</head>
