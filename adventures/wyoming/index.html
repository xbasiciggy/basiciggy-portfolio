  <script>
  (()=>{
    const grid=document.querySelector('.gallery-grid');
    const figures=[...grid.querySelectorAll('.photo')];
    const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let firstLayoutDone=false;
    const columnCount=()=>{
      const w=window.innerWidth;
      if(w<=740)return 2;
      if(w<=1100)return 3;
      if(w<=1500)return 4;
      return 5;
    };
    const ratioOf=(figure)=>{
      // Trust the browser once the photo has decoded; before that use the
      // dimensions written at publish time; fall back to 4:3 so nothing vanishes.
      const img=figure.querySelector('img');
      let r=img.naturalWidth&&img.naturalHeight?img.naturalWidth/img.naturalHeight:parseFloat(figure.dataset.ratio||'');
      if(!r||!isFinite(r))r=4/3;
      return Math.min(Math.max(r,.42),2.6);
    };
    // Gap-free balanced masonry:
    // 1. place photos in order into the shortest column,
    // 2. move/swap photos between the tallest and shortest columns until they
    //    are as even as possible (photos rearrange themselves to fill holes),
    // 3. keep reading order inside each column,
    // 4. stretch or trim each column by a few pixels so every column ends on
    //    exactly the same line (object-fit: cover absorbs the difference).
    const plan=(cols,width)=>{
      const gutter=cols<=2?Math.max(6,width*.018):Math.max(6,width*.0066);
      const colWidth=(width-gutter*(cols-1))/cols;
      const items=figures.map((figure,index)=>({figure,index,h:colWidth/ratioOf(figure)}));
      const columns=Array.from({length:cols},()=>({items:[],h:0}));
      const heightOf=(c)=>c.items.reduce((sum,it)=>sum+it.h,0)+gutter*Math.max(0,c.items.length-1);

      items.forEach(it=>{
        let target=columns[0];
        columns.forEach(c=>{if(c.h<target.h-.5)target=c;});
        target.items.push(it);
        target.h=heightOf(target);
      });

      for(let pass=0;pass<60&&cols>1;pass++){
        columns.forEach(c=>{c.h=heightOf(c);});
        const ordered=[...columns].sort((a,b)=>a.h-b.h);
        const low=ordered[0],high=ordered[ordered.length-1];
        const spread=high.h-low.h;
        if(spread<1)break;
        let best=null,bestSpread=spread-.5;
        if(high.items.length>1){
          high.items.forEach((it,i)=>{
            const next=Math.abs((high.h-it.h-gutter)-(low.h+it.h+gutter));
            if(next<bestSpread){bestSpread=next;best={move:i};}
          });
        }
        high.items.forEach((a,i)=>low.items.forEach((b,j)=>{
          const d=a.h-b.h;
          if(d<=0)return;
          const next=Math.abs(spread-2*d);
          if(next<bestSpread){bestSpread=next;best={swap:[i,j]};}
        }));
        if(!best)break;
        if(best.move!==undefined){
          low.items.push(high.items.splice(best.move,1)[0]);
        }else{
          const [i,j]=best.swap;
          const a=high.items[i];
          high.items[i]=low.items[j];
          low.items[j]=a;
        }
      }

      columns.forEach(c=>{c.items.sort((a,b)=>a.index-b.index);c.h=heightOf(c);});
      // The column holding the first photo sits on the left so the gallery still opens with it.
      columns.sort((a,b)=>a.items[0].index-b.items[0].index);
      const target=columns.reduce((sum,c)=>sum+c.h,0)/cols;
      const deviation=Math.max(...columns.map(c=>{
        const gutters=gutter*(c.items.length-1);
        return Math.abs((target-gutters)/Math.max(1,c.h-gutters)-1);
      }));
      return {cols,gutter,colWidth,columns,target,deviation};
    };
    const layout=()=>{
      const width=grid.clientWidth;
      if(width<80||!figures.length)return;
      // Use the preferred column count unless squaring up the bottom would crop
      // photos by more than ~12%; then try fewer columns (small galleries).
      const preferred=Math.max(1,Math.min(columnCount(),figures.length));
      const floor=figures.length>1?Math.min(2,preferred):1;
      let chosen=null;
      for(let c=preferred;c>=floor;c--){
        const candidate=plan(c,width);
        if(!chosen||candidate.deviation<chosen.deviation)chosen=candidate;
        if(candidate.deviation<=.12){chosen=candidate;break;}
      }
      const {gutter,colWidth,columns,target}=chosen;

      columns.forEach((c,ci)=>{
        const gutters=gutter*(c.items.length-1);
        const scale=(target-gutters)/Math.max(1,c.h-gutters);
        const x=Math.round(ci*(colWidth+gutter)*10)/10;
        const w=Math.round(colWidth*10)/10;
        let y=0;
        c.items.forEach((it,k)=>{
          const top=Math.round(y);
          const bottom=k===c.items.length-1?Math.round(target):Math.round(y+it.h*scale);
          it.figure.style.width=`${w}px`;
          it.figure.style.height=`${Math.max(1,bottom-top)}px`;
          it.figure.style.transform=`translate3d(${x}px,${top}px,0)`;
          it.figure.classList.add('gm-laid-out');
          y=bottom+gutter;
        });
      });
      grid.style.height=`${Math.round(target)}px`;
      if(!firstLayoutDone){
        firstLayoutDone=true;
        if(!reduceMotion){
          requestAnimationFrame(()=>figures.forEach(f=>f.classList.add('gm-animate')));
        }
      }
    };
    const schedule=()=>requestAnimationFrame(layout);
    figures.forEach(f=>{
      const img=f.querySelector('img');
      const markLoaded=()=>img.classList.add('gm-loaded');
      if(img.complete&&img.naturalWidth){markLoaded();schedule();}
      else{
        img.addEventListener('load',()=>{markLoaded();schedule();},{once:true});
        img.addEventListener('error',schedule,{once:true});
      }
    });
    let resizeTimer=0;
    const scheduleResize=()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(layout,80);};
    window.addEventListener('resize',scheduleResize,{passive:true});
    if('ResizeObserver'in window)new ResizeObserver(scheduleResize).observe(grid);
    layout();

    const buttons=[...document.querySelectorAll('.photo-button')],box=document.getElementById('lightbox'),img=box.querySelector('img'),media=box.querySelector('.lightbox-media'),count=box.querySelector('.lightbox-count');let i=0;
    let zoom=1,tx=0,ty=0,startX=0,startY=0,lastDistance=0,startZoom=1,dragging=false;
    const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
    const applyTransform=()=>{img.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${zoom})`;};
    const resetZoom=()=>{zoom=1;tx=0;ty=0;lastDistance=0;dragging=false;applyTransform();};
    const preloadAround=()=>{
      if(!buttons.length)return;
      [1,-1].forEach(offset=>{const next=buttons[(i+offset+buttons.length)%buttons.length]?.dataset.full;if(next){const preload=new Image();preload.src=next;}});
    };
    const swapLightboxImage=n=>{i=(n+buttons.length)%buttons.length;resetZoom();img.src=buttons[i].dataset.full;count.textContent=`${String(i+1).padStart(2,'0')} / ${String(buttons.length).padStart(2,'0')}`;preloadAround();};
    const show=n=>{
      if(reduceMotion){swapLightboxImage(n);return;}
      img.style.opacity='0';
      window.setTimeout(()=>{swapLightboxImage(n);requestAnimationFrame(()=>{img.style.opacity='1'});},120);
    };
    const distance=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
    media.addEventListener('touchstart',e=>{
      if(e.touches.length===2){lastDistance=distance(e.touches);startZoom=zoom;e.preventDefault();return;}
      if(e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY;dragging=zoom>1;}
    },{passive:false});
    media.addEventListener('touchmove',e=>{
      if(e.touches.length===2){const d=distance(e.touches);if(lastDistance>0){zoom=clamp(startZoom*(d/lastDistance),1,5);applyTransform();}e.preventDefault();return;}
      if(e.touches.length===1&&zoom>1){const nx=e.touches[0].clientX,ny=e.touches[0].clientY;tx+=nx-startX;ty+=ny-startY;startX=nx;startY=ny;dragging=true;applyTransform();e.preventDefault();}
    },{passive:false});
    media.addEventListener('touchend',e=>{
      if(e.touches.length<2)lastDistance=0;
      if(!e.touches.length&&zoom<=1.01)resetZoom();
    },{passive:true});
    let swipeStartX=0,swipeStartY=0;
    box.addEventListener('touchstart',e=>{if(e.touches.length===1&&zoom===1){swipeStartX=e.touches[0].clientX;swipeStartY=e.touches[0].clientY;}},{passive:true});
    box.addEventListener('touchend',e=>{if(zoom!==1||dragging||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-swipeStartX,dy=e.changedTouches[0].clientY-swipeStartY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)show(i+(dx<0?1:-1));},{passive:true});
    img.addEventListener('dblclick',()=>{zoom=zoom>1?1:2.5;tx=0;ty=0;applyTransform();});
    buttons.forEach((b,n)=>b.addEventListener('click',()=>{show(n);box.showModal()}));box.querySelector('.lightbox-close').onclick=()=>box.close();box.querySelector('.lightbox-prev').onclick=()=>show(i-1);box.querySelector('.lightbox-next').onclick=()=>show(i+1);document.addEventListener('keydown',e=>{if(!box.open)return;if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1);if(e.key==='Escape')box.close()});
  })();
  </script>
</body>
</html>
