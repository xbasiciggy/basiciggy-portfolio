<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070809">
  <title>Adventure Map — Basiciggy</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070809;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.map-shell{position:relative;width:100%;height:100%;overflow:hidden}.map{position:absolute;inset:0;background:#0a0b0c}.map-top{position:absolute;z-index:1000;left:18px;right:18px;top:max(16px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;pointer-events:none}.map-top a,.map-top .count{pointer-events:auto;color:#fff;text-decoration:none;background:rgba(10,10,12,.68);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:999px;padding:11px 15px;font-size:12px;font-weight:600}.map-top .brand{letter-spacing:.16em;text-transform:uppercase}.map-bottom{position:absolute;z-index:900;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(720px,calc(100% - 28px));pointer-events:none}.map-note{pointer-events:auto;background:rgba(10,10,12,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:14px 16px;color:rgba(255,255,255,.7);font-size:12px;text-align:center}.leaflet-container{font-family:inherit;background:#0a0b0c}.leaflet-control-attribution{background:rgba(0,0,0,.46)!important;color:rgba(255,255,255,.5)!important}.leaflet-control-attribution a{color:rgba(255,255,255,.72)!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#111214;color:#fff}.leaflet-popup-content-wrapper{border-radius:18px;padding:0;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 60px rgba(0,0,0,.45)}.leaflet-popup-content{margin:0;width:260px!important}.gm-popup img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.gm-popup-copy{padding:13px}.gm-popup h3{margin:0 0 4px;font-size:25px;letter-spacing:-.045em}.gm-popup p{margin:0;color:rgba(255,255,255,.55);font-size:12px}.gm-popup a{display:inline-flex;margin-top:12px;color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:9px 12px;border-radius:999px;background:#1ccf63}.gm-pin-drop{position:relative;width:34px;height:44px;opacity:0;transform:translate3d(0,-64vh,0) scale(.74);transform-origin:50% 100%;filter:drop-shadow(0 10px 12px rgba(0,0,0,.5));animation:gmPinDrop .78s cubic-bezier(.18,.82,.28,1.16) forwards;animation-delay:var(--gm-pin-delay,0ms);will-change:transform,opacity}.gm-pin-drop::after{content:"";position:absolute;left:50%;bottom:-2px;width:28px;height:8px;border-radius:50%;background:radial-gradient(ellipse,rgba(225,18,31,.32) 0%,rgba(112,0,10,.12) 45%,transparent 72%);transform:translateX(-50%) scale(.2);opacity:0;animation:gmPinRipple .52s ease-out forwards;animation-delay:calc(var(--gm-pin-delay,0ms) + 560ms)}.gm-pin-satin{position:absolute;left:50%;top:1px;width:30px;height:30px;transform:translateX(-50%) rotate(-45deg);border-radius:50% 50% 50% 0;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.92) 0 5%,rgba(255,255,255,.34) 6% 13%,transparent 14%),linear-gradient(145deg,#ff7a80 0%,#ef3440 24%,#c40b18 50%,#7e020c 76%,#3f0106 100%);border:1px solid rgba(255,150,155,.58);box-shadow:inset 5px 5px 9px rgba(255,255,255,.17),inset -7px -8px 11px rgba(38,0,5,.5),0 8px 18px rgba(0,0,0,.5)}.gm-pin-satin::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff 0 8%,#f6dadd 11%,#b30915 42%,#560008 100%);box-shadow:0 0 0 2px rgba(55,0,5,.34),inset 1px 1px 2px rgba(255,255,255,.42);transform:translate(-50%,-50%)}@keyframes gmPinDrop{0%{opacity:0;transform:translate3d(0,-64vh,0) scale(.74)}16%{opacity:1}72%{transform:translate3d(0,8px,0) scale(1.04)}86%{transform:translate3d(0,-3px,0) scale(.99)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}@keyframes gmPinRipple{0%{opacity:0;transform:translateX(-50%) scale(.2)}30%{opacity:.7}100%{opacity:0;transform:translateX(-50%) scale(1.55)}}@media(prefers-reduced-motion:reduce){.gm-pin-drop{animation:none;opacity:1;transform:none}.gm-pin-drop::after{display:none}}
  </style>

<!-- GALLERY_MANAGER:THEME_SYSTEM:START -->
<script id="gallery-manager-dark-ui-boot">
(()=>{
  document.documentElement.dataset.gmTheme='dark';
  document.documentElement.dataset.gmPage='map';
  document.documentElement.style.colorScheme='dark';
  try{localStorage.removeItem('basiciggy-theme')}catch(e){}
  const cleanup=()=>document.querySelectorAll('.gm-theme-toggle').forEach(node=>node.remove());
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',cleanup,{once:true});else cleanup();
})();
</script>
<style id="gallery-manager-dark-ui-style">
  :root{color-scheme:dark;--gm-bg:#050505;--gm-bg-soft:#0b0b0c;--gm-surface:rgba(17,18,19,.72);--gm-surface-solid:#111213;--gm-text:#f7f7f5;--gm-muted:rgba(247,247,245,.62);--gm-border:rgba(255,255,255,.12);--gm-shadow:rgba(0,0,0,.55);--gm-photo-mat:#050505;--gm-accent:#9dffb1}
  html,body{background:#050505 !important;color:#f7f7f5 !important}
  html[data-gm-page="home"] .gm-centered-brand{position:absolute !important;left:50% !important;right:auto !important;margin-left:0 !important;margin-right:0 !important;transform:translateX(-50%) !important;z-index:20 !important}
  dialog.lightbox,.lightbox::backdrop,.lightbox-stage,.lightbox-media{background:#050505 !important;color:#fff !important}
  .lightbox-close,.lightbox-prev,.lightbox-next{color:#fff !important;background:rgba(20,20,20,.62) !important;border-color:rgba(255,255,255,.12) !important}
  .lightbox-info{color:#fff !important;background:rgba(18,18,18,.5) !important;border-color:rgba(255,255,255,.1) !important}
  @media(max-width:760px){html[data-gm-page="home"] .gm-centered-brand{left:50% !important;transform:translateX(-50%) !important}}
</style>
<script id="gallery-manager-dark-ui-home-logo">
(()=>{
  if(window.__gmDarkUIInstalled)return;window.__gmDarkUIInstalled=true;
  const init=()=>{
    document.querySelectorAll('.gm-theme-toggle').forEach(node=>node.remove());
    if(document.documentElement.dataset.gmPage!=='home')return;
    const candidates=[...document.querySelectorAll('header a,header .logo,header .site-logo,header .brand,.topbar a,.topbar .logo,.topbar .site-logo,.topbar .brand,.site-header a,.site-header .logo,.site-header .site-logo,.site-header .brand')];
    const named=candidates.find(el=>/basiciggy/i.test((el.textContent||el.getAttribute?.('aria-label')||el.getAttribute?.('alt')||'').trim()));
    const visual=document.querySelector('header .logo,header .site-logo,header .brand,.topbar .logo,.topbar .site-logo,.topbar .brand,.site-header .logo,.site-header .site-logo,.site-header .brand');
    const brand=named||(visual?.closest?.('a')||visual);
    if(brand)brand.classList.add('gm-centered-brand');
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
<!-- GALLERY_MANAGER:THEME_SYSTEM:END -->
</head>
<body>
  <div class="map-shell">
    <div id="map" class="map"></div>
    <div class="map-top"><a class="brand" href="/adventures/">← Adventures</a><div class="count">5 mapped galleries</div></div>
    <div class="map-bottom"><div class="map-note">Tap a pin to open its gallery. Add or edit gallery coordinates in Gallery Manager → Galleries.</div></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (()=>{
    const pins=[{"longitude":-104.8199,"latitude":41.139800000000001,"photoCount":24,"id":"B097918A-720F-4EC7-8E91-BC0AB0B842A2","location":"Wyoming, USA","url":"\/adventures\/wyoming\/","title":"Wyoming","cover":"\/adventures\/wyoming\/photos\/024.jpg"},{"location":"Banff Canada","latitude":51.176588000000002,"photoCount":18,"title":"Banff","cover":"\/adventures\/banff\/photos\/001.jpg","url":"\/adventures\/banff\/","longitude":-115.570936,"id":"8ABC018D-F18A-4E48-8D85-7BB2F661428D"},{"url":"\/adventures\/oahu\/","longitude":-157.85816399999999,"photoCount":19,"id":"BA929CFC-03B8-4461-8A9A-D001F0E51D73","latitude":21.305053999999998,"location":"Honolulu, Hawaii","title":"Oahu","cover":"\/adventures\/oahu\/photos\/014.jpg"},{"cover":"\/adventures\/sequoia\/photos\/017.jpg","url":"\/adventures\/sequoia\/","longitude":-118.73095000000001,"photoCount":18,"title":"Sequoia","id":"542A09B9-27A1-4188-804F-A130C97BD641","latitude":36.604365999999999,"location":"Sequoia National Park"},{"title":"Italy","url":"\/adventures\/italy-63ply\/","cover":"\/adventures\/italy-63ply\/photos\/001.jpg","latitude":42.672998999999997,"location":"Italy","id":"8093331F-E1FB-4CEC-ADE8-6E4DF9854AEA","photoCount":40,"longitude":12.592684}];
    const map=L.map('map',{zoomControl:false,worldCopyJump:true,attributionControl:true});
    L.control.zoom({position:'bottomright'}).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);
    const bounds=pins.map(pin=>[pin.latitude,pin.longitude]);
    if(bounds.length>1)map.fitBounds(bounds,{padding:[70,70],maxZoom:8,animate:false});
    else if(bounds.length===1)map.setView(bounds[0],7,{animate:false});
    else map.setView([39,-98],4,{animate:false});
    const safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const addPins=()=>{
      pins.forEach((pin,index)=>{
        const delay=reduceMotion?0:Math.min(index*90,720);
        const icon=L.divIcon({className:'',html:`<div class="gm-pin-drop" style="--gm-pin-delay:${delay}ms"><div class="gm-pin-satin"></div></div>`,iconSize:[34,44],iconAnchor:[17,41],popupAnchor:[0,-38]});
        const marker=L.marker([pin.latitude,pin.longitude],{icon,keyboard:true,title:pin.title,alt:`${pin.title} map pin`}).addTo(map);
        marker.bindPopup(`<div class="gm-popup"><img src="${safe(pin.cover)}" alt="${safe(pin.title)}"><div class="gm-popup-copy"><h3>${safe(pin.title)}</h3><p>${safe(pin.location)} · ${pin.photoCount} photos</p><a href="${safe(pin.url)}">Open Gallery ↗</a></div></div>`,{maxWidth:280,minWidth:260});
      });
    };
    map.whenReady(()=>{
      if(reduceMotion){addPins();return;}
      requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(addPins,120)));
    });
  })();
  </script>
</body>
</html>
