    *{box-sizing:border-box}html{background:#050505;color:#f5f5f5}body{margin:0;background:#050505;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}

    .gallery-intro{max-width:1320px;margin:0 auto;padding:46px clamp(12px,2vw,24px) 22px;display:flex;justify-content:space-between;align-items:end;gap:30px}.gallery-intro h2{font-size:clamp(26px,3.6vw,48px);line-height:1;letter-spacing:-.045em;margin:0}.gallery-intro p{max-width:520px;margin:0;color:rgba(255,255,255,.52);font-size:13px;line-height:1.6}
    .gallery-grid{--gm-gutter:.66%;position:relative;max-width:1560px;margin:0 auto;padding:0 clamp(8px,1vw,14px) 94px;min-height:120px}.photo{position:absolute;left:0;top:0;margin:0;min-width:0;overflow:hidden;border-radius:6px;background:#0a0a0a;opacity:0;will-change:transform,opacity;transition:opacity .42s ease,box-shadow .3s ease}.photo.gm-laid-out{opacity:1}.photo.gm-animate{transition:opacity .42s ease,box-shadow .3s ease,transform .4s cubic-bezier(.22,.61,.36,1)}.photo-button{appearance:none;border:0;padding:0;margin:0;width:100%;height:100%;display:block;background:#0a0a0a;cursor:zoom-in;overflow:hidden}.photo img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:transform .45s cubic-bezier(.17,.84,.44,1),filter .35s ease,opacity .5s ease}.photo img.gm-loaded{opacity:1}.photo-button:hover img{transform:scale(1.018);filter:brightness(.92)}
    .gallery-footer{max-width:1320px;margin:0 auto;padding:28px clamp(12px,2vw,24px) 80px;border-top:1px solid rgba(255,255,255,.09);display:flex;justify-content:space-between;gap:20px}.gallery-footer a{color:#fff;text-decoration:none;font-size:clamp(20px,2.6vw,38px);letter-spacing:-.035em}.gallery-footer span{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.45;margin-bottom:8px}
    dialog.lightbox{border:0;padding:0;background:rgba(0,0,0,.96);width:100vw;height:100vh;max-width:none;max-height:none;color:#fff}.lightbox::backdrop{background:#000}.lightbox-stage{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:40px}.lightbox img{max-width:100%;max-height:100%;object-fit:contain;opacity:1;transition:opacity .22s ease}.lightbox-close,.lightbox-prev,.lightbox-next{position:absolute;z-index:3;appearance:none;border:0;background:rgba(20,20,20,.62);backdrop-filter:blur(16px);color:white;border:1px solid rgba(255,255,255,.12);width:48px;height:48px;border-radius:999px;font-size:22px;cursor:pointer}.lightbox-close{right:18px;top:18px}.lightbox-prev{left:18px;top:50%}.lightbox-next{right:18px;top:50%}.lightbox-count{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.6}
    @media(max-width:720px){.gallery-nav{padding:16px;grid-template-columns:1fr 1fr}.gallery-nav .brand{display:none}.gallery-hero{height:62vh;min-height:440px}.hero-copy{display:block;left:18px;right:18px;bottom:28px}.hero-title{font-size:clamp(52px,18vw,92px);line-height:.82}.hero-meta{text-align:left;margin-top:16px}.gallery-intro{padding:30px 8px 16px;display:block}.gallery-intro p{margin-top:12px}.gallery-grid{padding:0 6px 64px;--gm-gutter:2.4%}.photo{border-radius:5px}.gallery-footer{padding:24px 10px 54px}.lightbox-stage{padding:18px}.lightbox-prev,.lightbox-next{top:auto;bottom:16px}.lightbox-count{bottom:31px}}
    @media(prefers-reduced-motion:reduce){.photo,.photo.gm-animate,.photo img,.lightbox img{transition:none !important}.photo-button:hover img{transform:none !important}}
    @view-transition{navigation:auto}
  </style>

  <script>
  (()=>{
    const grid=document.querySelector('.gallery-grid');
    const figures=[...grid.querySelectorAll('.photo')];
    const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let firstLayoutDone=false;
    const columnCount=()=>{
      const w=window.innerWidth;
      if(w<=740)return 2;
      if(w<=980)return 3;
      if(w<=1280)return 4;
      if(w<=1600)return 5;
      return 6;
    };
    const layout=()=>{
      const cols=columnCount();
      const width=grid.clientWidth;
      if(width<80)return;
      const gutterRatio=cols===2?.024:.0066;
      const gutter=Math.max(cols===2?6:5,width*gutterRatio);
      const colWidth=(width-gutter*(cols-1))/cols;
      // Rectangle-aware first-fit masonry. Unlike a skyline/shortest-column
      // layout, this backfills real holes left under multi-column panoramas.
      const placed=[];
      const columnX=(c)=>c*(colWidth+gutter);
      const overlaps=(a0,a1,b0,b1)=>a0<b1-.25&&a1>b0+.25;
      const collides=(start,span,y,h)=>placed.some(p=>{
        const sharesColumns=start<p.col+p.span&&start+span>p.col;
        return sharesColumns&&overlaps(y,y+h,p.y,p.y+p.h);
      });
      const candidateYs=()=>{
        const values=[0];
        placed.forEach(p=>values.push(p.y+p.h+gutter));
        return [...new Set(values.map(v=>Math.max(0,Math.round(v*100)/100)))].sort((a,b)=>a-b);
      };
      figures.forEach((figure)=>{
        const image=figure.querySelector('img');
        let ratio=image.naturalWidth&&image.naturalHeight?image.naturalWidth/image.naturalHeight:NaN;
        if(!ratio||!isFinite(ratio)){
          // A photo that failed to decode (unsupported format, network hiccup) would
          // otherwise vanish from the grid and leave a permanent hole. Give it a
          // sane fallback ratio so the packer still reserves it a slot.
          ratio=4/3;
        }
        // Keep normal photos in one lane. Only genuine panoramas span, so the
        // feed stays readable while the first-fit search closes any holes.
        let span=1;
        if(cols>=4&&ratio>2.4)span=2;
        if(cols>=6&&ratio>3.5)span=3;
        span=Math.min(span,cols);
        const itemWidth=Math.round((colWidth*span+gutter*(span-1))*10)/10;
        const itemHeight=Math.round((itemWidth/ratio)*10)/10;
        let best=null;
        const ys=candidateYs();
        outer: for(const y of ys){
          for(let start=0;start<=cols-span;start++){
            if(!collides(start,span,y,itemHeight)){
              best={col:start,y};
              break outer;
            }
          }
        }
        // There is always a legal slot below the current layout, but keep a
        // fallback for malformed dimensions just in case.
        if(!best){
          const bottom=placed.reduce((m,p)=>Math.max(m,p.y+p.h+gutter),0);
          best={col:0,y:bottom};
        }
        const x=Math.round(columnX(best.col)*10)/10;
        figure.style.width=`${itemWidth}px`;
        figure.style.height=`${itemHeight}px`;
        figure.style.transform=`translate3d(${x}px,${best.y}px,0)`;
        figure.classList.add('gm-laid-out');
        placed.push({col:best.col,span,y:best.y,h:itemHeight});
      });
      const bottom=placed.reduce((m,p)=>Math.max(m,p.y+p.h),0);
      grid.style.height=`${Math.max(0,bottom)}px`;
      if(!firstLayoutDone){
        firstLayoutDone=true;
        if(!reduceMotion){
          requestAnimationFrame(()=>figures.forEach(f=>f.classList.add('gm-animate')));
        }
      }
    };
    const schedule=()=>requestAnimationFrame(layout);
    figures.forEach(f=>{
      const img=f.querySelector('img');
      const markLoaded=()=>img.classList.add('gm-loaded');
      if(img.complete&&img.naturalWidth){markLoaded();schedule();}
      else{
        img.addEventListener('load',()=>{markLoaded();schedule();},{once:true});
        img.addEventListener('error',schedule,{once:true});
      }
    });
    let resizeTimer=0;
    const scheduleResize=()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(layout,80);};
    window.addEventListener('resize',scheduleResize,{passive:true});
    if('ResizeObserver'in window)new ResizeObserver(scheduleResize).observe(grid);
    layout();

    const buttons=[...document.querySelectorAll('.photo-button')],box=document.getElementById('lightbox'),img=box.querySelector('img'),count=box.querySelector('.lightbox-count');let i=0;
    const swapLightboxImage=n=>{i=(n+buttons.length)%buttons.length;img.src=buttons[i].dataset.full;count.textContent=`${String(i+1).padStart(2,'0')} / ${String(buttons.length).padStart(2,'0')}`;};
    const show=n=>{
      if(reduceMotion){swapLightboxImage(n);return;}
      img.style.opacity='0';
      window.setTimeout(()=>{swapLightboxImage(n);requestAnimationFrame(()=>{img.style.opacity='1'});},120);
    };
    buttons.forEach((b,n)=>b.addEventListener('click',()=>{show(n);box.showModal()}));box.querySelector('.lightbox-close').onclick=()=>box.close();box.querySelector('.lightbox-prev').onclick=()=>show(i-1);box.querySelector('.lightbox-next').onclick=()=>show(i+1);document.addEventListener('keydown',e=>{if(!box.open)return;if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1);if(e.key==='Escape')box.close()});let x=0;box.addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});box.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>45)show(i+(d<0?1:-1))},{passive:true});
  })();
  </script>
