<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="color-scheme" content="dark">
  <title>Banff — Basiciggy</title>
  <link rel="stylesheet" href="../../assets/styles.css">
  <style>
    *{box-sizing:border-box}html{background:#050505;color:#f5f5f5}body{margin:0;background:#050505;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
    .gallery-nav{position:fixed;z-index:50;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px 24px;background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,0));pointer-events:none}
    .gallery-nav a{pointer-events:auto;color:#fff;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.02em}.gallery-nav .brand{text-transform:uppercase;letter-spacing:.16em;font-size:11px}.gallery-nav .back{justify-self:end;opacity:.75}
    .gallery-hero{position:relative;height:min(86vh,920px);min-height:560px;overflow:hidden;background:#111}
    .gallery-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.002)}
    .gallery-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.50) 76%,#050505 100%);pointer-events:none}
    .hero-copy{position:absolute;z-index:2;left:clamp(20px,5vw,76px);right:clamp(20px,5vw,76px);bottom:clamp(36px,7vh,90px);display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
    .hero-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.2em;opacity:.7;margin-bottom:14px}.hero-title{margin:0;font-size:clamp(64px,11vw,170px);line-height:.78;letter-spacing:-.07em;font-weight:600;max-width:1100px}.hero-meta{font-size:13px;line-height:1.5;opacity:.72;text-align:right;white-space:nowrap;padding-bottom:8px}
    .gallery-intro{max-width:1500px;margin:0 auto;padding:62px clamp(18px,3vw,42px) 34px;display:flex;justify-content:space-between;align-items:end;gap:30px}.gallery-intro h2{font-size:clamp(28px,4vw,54px);line-height:1;letter-spacing:-.045em;margin:0}.gallery-intro p{max-width:560px;margin:0;color:rgba(255,255,255,.55);font-size:14px;line-height:1.65}
    .gallery-grid{max-width:1500px;margin:0 auto;padding:0 clamp(10px,2vw,26px) 110px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.35vw,20px)}
    .photo{margin:0;min-width:0}.photo.wide{grid-column:1/-1}.photo-button{appearance:none;border:0;padding:0;margin:0;width:100%;display:block;background:#0a0a0a;cursor:zoom-in;overflow:hidden;border-radius:8px}.photo img{display:block;width:100%;height:auto;min-height:240px;object-fit:cover;transition:transform .55s cubic-bezier(.2,.7,.2,1),opacity .4s ease}.photo-button:hover img{transform:scale(1.012)}
    .gallery-footer{max-width:1500px;margin:0 auto;padding:30px clamp(18px,3vw,42px) 90px;border-top:1px solid rgba(255,255,255,.09);display:flex;justify-content:space-between;gap:20px}.gallery-footer a{color:#fff;text-decoration:none;font-size:clamp(22px,3vw,42px);letter-spacing:-.035em}.gallery-footer span{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.45;margin-bottom:8px}
    dialog.lightbox{border:0;padding:0;background:rgba(0,0,0,.96);width:100vw;height:100vh;max-width:none;max-height:none;color:#fff}.lightbox::backdrop{background:#000}.lightbox-stage{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:40px}.lightbox img{max-width:100%;max-height:100%;object-fit:contain}.lightbox-close,.lightbox-prev,.lightbox-next{position:absolute;z-index:3;appearance:none;border:0;background:rgba(20,20,20,.62);backdrop-filter:blur(16px);color:white;border:1px solid rgba(255,255,255,.12);width:48px;height:48px;border-radius:999px;font-size:22px;cursor:pointer}.lightbox-close{right:18px;top:18px}.lightbox-prev{left:18px;top:50%}.lightbox-next{right:18px;top:50%}.lightbox-count{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.6}
    @media(max-width:760px){.gallery-nav{padding:16px}.gallery-nav .brand{display:none}.gallery-nav{grid-template-columns:1fr 1fr}.gallery-hero{height:72vh;min-height:500px}.hero-copy{display:block;left:18px;right:18px;bottom:34px}.hero-title{font-size:clamp(56px,20vw,100px);line-height:.82}.hero-meta{text-align:left;margin-top:18px}.gallery-intro{padding:38px 16px 24px;display:block}.gallery-intro p{margin-top:14px}.gallery-grid{grid-template-columns:1fr;padding:0 10px 72px;gap:10px}.photo.wide{grid-column:auto}.photo-button{border-radius:6px}.gallery-footer{padding:26px 16px 60px}.lightbox-stage{padding:18px}.lightbox-prev,.lightbox-next{top:auto;bottom:16px}.lightbox-count{bottom:31px}}
  </style>
</head>

  <dialog class="lightbox" id="lightbox">
    <div class="lightbox-stage">
      <button class="lightbox-close" aria-label="Close">×</button>
      <button class="lightbox-prev" aria-label="Previous">‹</button>
      <img alt="Expanded gallery photograph">
      <button class="lightbox-next" aria-label="Next">›</button>
      <div class="lightbox-count"></div>
    </div>
  </dialog>
  <script>
  (()=>{const buttons=[...document.querySelectorAll('.photo-button')],box=document.getElementById('lightbox'),img=box.querySelector('img'),count=box.querySelector('.lightbox-count');let i=0;const show=n=>{i=(n+buttons.length)%buttons.length;img.src=buttons[i].dataset.full;count.textContent=`${String(i+1).padStart(2,'0')} / ${String(buttons.length).padStart(2,'0')}`};buttons.forEach((b,n)=>b.addEventListener('click',()=>{show(n);box.showModal()}));box.querySelector('.lightbox-close').onclick=()=>box.close();box.querySelector('.lightbox-prev').onclick=()=>show(i-1);box.querySelector('.lightbox-next').onclick=()=>show(i+1);document.addEventListener('keydown',e=>{if(!box.open)return;if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1);if(e.key==='Escape')box.close()});let x=0;box.addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});box.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>45)show(i+(d<0?1:-1))},{passive:true});})();
