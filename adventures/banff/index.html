  <style>
    *{box-sizing:border-box}html{background:#050505;color:#f5f5f5}body{margin:0;background:#050505;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
    .gallery-nav{position:fixed;z-index:50;top:0;left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px 24px;background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,0));pointer-events:none}.gallery-nav a{pointer-events:auto;color:#fff;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.02em}.gallery-nav .brand{text-transform:uppercase;letter-spacing:.16em;font-size:11px}.gallery-nav .back{justify-self:end;opacity:.75}
    .gallery-hero{position:relative;height:min(72vh,760px);min-height:500px;overflow:hidden;background:#111}.gallery-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%;display:block;transform:scale(1.002)}.gallery-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06) 0%,rgba(0,0,0,.04) 44%,rgba(0,0,0,.44) 78%,#050505 100%);pointer-events:none}
    .hero-copy{position:absolute;z-index:2;left:clamp(20px,5vw,76px);right:clamp(20px,5vw,76px);bottom:clamp(30px,6vh,72px);display:flex;align-items:flex-end;justify-content:space-between;gap:30px}.hero-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.2em;opacity:.7;margin-bottom:14px}.hero-title{margin:0;font-size:clamp(62px,10vw,158px);line-height:.78;letter-spacing:-.07em;font-weight:600;max-width:1100px}.hero-meta{font-size:13px;line-height:1.5;opacity:.72;text-align:right;white-space:nowrap;padding-bottom:8px}
    .gallery-intro{max-width:1320px;margin:0 auto;padding:46px clamp(12px,2vw,24px) 22px;display:flex;justify-content:space-between;align-items:end;gap:30px}.gallery-intro h2{font-size:clamp(26px,3.6vw,48px);line-height:1;letter-spacing:-.045em;margin:0}.gallery-intro p{max-width:520px;margin:0;color:rgba(255,255,255,.52);font-size:13px;line-height:1.6}
    .gallery-grid{--gm-row:6px;--gm-gap:8px;max-width:1320px;margin:0 auto;padding:0 clamp(8px,1.25vw,16px) 94px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:var(--gm-row);grid-auto-flow:dense;gap:var(--gm-gap);align-items:start}.photo{margin:0;min-width:0;overflow:hidden;border-radius:5px;background:#0a0a0a;aspect-ratio:4/3}.photo-button{appearance:none;border:0;padding:0;margin:0;width:100%;height:100%;display:block;background:#0a0a0a;cursor:zoom-in;overflow:hidden}.photo img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.2,1)}.photo-button:hover img{transform:scale(1.012)}
    .gallery-footer{max-width:1320px;margin:0 auto;padding:28px clamp(12px,2vw,24px) 80px;border-top:1px solid rgba(255,255,255,.09);display:flex;justify-content:space-between;gap:20px}.gallery-footer a{color:#fff;text-decoration:none;font-size:clamp(20px,2.6vw,38px);letter-spacing:-.035em}.gallery-footer span{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.45;margin-bottom:8px}
    dialog.lightbox{border:0;padding:0;background:rgba(0,0,0,.96);width:100vw;height:100vh;max-width:none;max-height:none;color:#fff}.lightbox::backdrop{background:#000}.lightbox-stage{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:40px}.lightbox img{max-width:100%;max-height:100%;object-fit:contain}.lightbox-close,.lightbox-prev,.lightbox-next{position:absolute;z-index:3;appearance:none;border:0;background:rgba(20,20,20,.62);backdrop-filter:blur(16px);color:white;border:1px solid rgba(255,255,255,.12);width:48px;height:48px;border-radius:999px;font-size:22px;cursor:pointer}.lightbox-close{right:18px;top:18px}.lightbox-prev{left:18px;top:50%}.lightbox-next{right:18px;top:50%}.lightbox-count{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.6}
    @media(max-width:1080px){.gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:720px){.gallery-nav{padding:16px}.gallery-nav .brand{display:none}.gallery-nav{grid-template-columns:1fr 1fr}.gallery-hero{height:62vh;min-height:440px}.hero-copy{display:block;left:18px;right:18px;bottom:28px}.hero-title{font-size:clamp(52px,18vw,92px);line-height:.82}.hero-meta{text-align:left;margin-top:16px}.gallery-intro{padding:30px 10px 18px;display:block}.gallery-intro p{margin-top:12px}.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 6px 64px;--gm-gap:6px;--gm-row:5px}.photo{border-radius:4px}.gallery-footer{padding:24px 10px 54px}.lightbox-stage{padding:18px}.lightbox-prev,.lightbox-next{top:auto;bottom:16px}.lightbox-count{bottom:31px}}
    @media(max-width:390px){.gallery-grid{grid-template-columns:1fr}}
  </style>

    <div class="lightbox-stage">
      <button class="lightbox-close" aria-label="Close">×</button>

  <script>
  (()=>{
    const grid=document.querySelector('.gallery-grid');
    const figures=[...grid.querySelectorAll('.photo')];
    const gap=()=>parseFloat(getComputedStyle(grid).getPropertyValue('--gm-gap'))||8;
    const row=()=>parseFloat(getComputedStyle(grid).getPropertyValue('--gm-row'))||6;
    const columns=()=>getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length;
    const layout=()=>{
      const cols=columns();
      const g=gap(),r=row();
      const cell=(grid.clientWidth-g*(cols-1))/Math.max(cols,1);
      figures.forEach((figure,index)=>{
        const image=figure.querySelector('img');
        if(!image.naturalWidth||!image.naturalHeight)return;
        const ratio=image.naturalWidth/image.naturalHeight;
        let span=1;
        if(cols>=4&&ratio>2.15)span=3;
        else if(cols>=2&&ratio>1.32)span=2;
        span=Math.min(span,cols);
        const width=cell*span+g*(span-1);
        const height=width/ratio;
        const rowSpan=Math.max(1,Math.ceil((height+g)/(r+g)));
        figure.style.gridColumn=`span ${span}`;
        figure.style.gridRowEnd=`span ${rowSpan}`;
        figure.style.height=`${height}px`;
        figure.classList.add('gm-laid-out');
      });
    };
    figures.forEach(f=>{const img=f.querySelector('img');if(img.complete)layout();else img.addEventListener('load',layout,{once:true})});
    let timer=0;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(layout,80)},{passive:true});
    if('ResizeObserver'in window)new ResizeObserver(layout).observe(grid);
    layout();

    const buttons=[...document.querySelectorAll('.photo-button')],box=document.getElementById('lightbox'),img=box.querySelector('img'),count=box.querySelector('.lightbox-count');let i=0;const show=n=>{i=(n+buttons.length)%buttons.length;img.src=buttons[i].dataset.full;count.textContent=`${String(i+1).padStart(2,'0')} / ${String(buttons.length).padStart(2,'0')}`};buttons.forEach((b,n)=>b.addEventListener('click',()=>{show(n);box.showModal()}));box.querySelector('.lightbox-close').onclick=()=>box.close();box.querySelector('.lightbox-prev').onclick=()=>show(i-1);box.querySelector('.lightbox-next').onclick=()=>show(i+1);document.addEventListener('keydown',e=>{if(!box.open)return;if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1);if(e.key==='Escape')box.close()});let x=0;box.addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});box.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>45)show(i+(d<0?1:-1))},{passive:true});
  })();
  </script>
