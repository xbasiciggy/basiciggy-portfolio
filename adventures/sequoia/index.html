<script id="gallery-manager-dark-ui-boot">
(()=>{
  document.documentElement.dataset.gmTheme='dark';
  document.documentElement.dataset.gmPage='gallery';
  document.documentElement.style.colorScheme='dark';
  try{localStorage.removeItem('basiciggy-theme')}catch(e){}
  const cleanup=()=>document.querySelectorAll('.gm-theme-toggle').forEach(node=>node.remove());
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',cleanup,{once:true});else cleanup();
})();
</script>

</style>
<script id="gallery-manager-dark-ui-home-logo">
(()=>{
  if(window.__gmDarkUIInstalled)return;window.__gmDarkUIInstalled=true;
  const init=()=>{
    document.querySelectorAll('.gm-theme-toggle').forEach(node=>node.remove());
    if(document.documentElement.dataset.gmPage!=='home')return;
    const candidates=[...document.querySelectorAll('header a,header .logo,header .site-logo,header .brand,.topbar a,.topbar .logo,.topbar .site-logo,.topbar .brand,.site-header a,.site-header .logo,.site-header .site-logo,.site-header .brand')];
    const named=candidates.find(el=>/basiciggy/i.test((el.textContent||el.getAttribute?.('aria-label')||el.getAttribute?.('alt')||'').trim()));
    const visual=document.querySelector('header .logo,header .site-logo,header .brand,.topbar .logo,.topbar .site-logo,.topbar .brand,.site-header .logo,.site-header .site-logo,.site-header .brand');
    const brand=named||(visual?.closest?.('a')||visual);
    if(brand)brand.classList.add('gm-centered-brand');
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
<!-- GALLERY_MANAGER:THEME_SYSTEM:END -->

  <dialog class="lightbox" id="lightbox">
    <div class="lightbox-stage">
      <button class="lightbox-close" aria-label="Close">×</button>
      <button class="lightbox-prev" aria-label="Previous">‹</button>
      <div class="lightbox-media" aria-busy="true"><div class="lightbox-skeleton" aria-hidden="true"></div><img class="lightbox-preview" alt="" aria-hidden="true" draggable="false"><img class="lightbox-full" alt="Expanded gallery photograph" draggable="false"><div class="lightbox-loading" aria-hidden="true">Loading full quality</div></div>
      <button class="lightbox-next" aria-label="Next">›</button>

  <script>
  (()=>{
    const grid=document.querySelector('.gallery-grid');
    const figures=[...grid.querySelectorAll('.photo')];
    const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let firstLayoutDone=false;
    const columnCount=()=>{
      const w=window.innerWidth;
      if(w<=740)return 2;
      if(w<=1100)return 3;
      if(w<=1500)return 4;
      return 5;
    };
    const ratioOf=(figure)=>{
      // Trust the browser once the photo has decoded; before that use the
      // dimensions written at publish time; fall back to 4:3 so nothing vanishes.
      const img=figure.querySelector('img');
      let r=img.naturalWidth&&img.naturalHeight?img.naturalWidth/img.naturalHeight:parseFloat(figure.dataset.ratio||'');
      if(!r||!isFinite(r))r=4/3;
      return Math.min(Math.max(r,.42),2.6);
    };
    // Aspect-preserving masonry. Every tile keeps the source photo's true
    // ratio, so portrait photographs are never cropped just to square up a row.
    // Items still flow into the shortest column to keep the desktop grid compact.
    const plan=(cols,width)=>{
      const gutter=cols<=2?Math.max(6,width*.018):Math.max(6,width*.0066);
      const colWidth=(width-gutter*(cols-1))/cols;
      const columns=Array.from({length:cols},()=>({items:[],h:0}));
      figures.forEach((figure,index)=>{
        const h=colWidth/ratioOf(figure);
        let target=columns[0];
        columns.forEach(c=>{if(c.h<target.h-.5)target=c;});
        target.items.push({figure,index,h});
        target.h+=h+(target.items.length>1?gutter:0);
      });
      // Keep the column containing the earliest image on the left while preserving
      // natural photo heights inside every column.
      columns.sort((a,b)=>(a.items[0]?.index??1e9)-(b.items[0]?.index??1e9));
      return {gutter,colWidth,columns,height:Math.max(...columns.map(c=>c.h),0)};
    };
    const layout=()=>{
      const width=grid.clientWidth;
      if(width<80||!figures.length)return;
      const cols=Math.max(1,Math.min(columnCount(),figures.length));
      const {gutter,colWidth,columns,height}=plan(cols,width);
      columns.forEach((c,ci)=>{
        const x=Math.round(ci*(colWidth+gutter)*10)/10;
        const w=Math.round(colWidth*10)/10;
        let y=0;
        c.items.forEach(it=>{
          const h=Math.max(1,Math.round(it.h*10)/10);
          it.figure.style.width=`${w}px`;
          it.figure.style.height=`${h}px`;
          it.figure.style.transform=`translate3d(${x}px,${Math.round(y*10)/10}px,0)`;
          it.figure.classList.add('gm-laid-out');
          y+=h+gutter;
        });
      });
      grid.style.height=`${Math.ceil(height)}px`;
      if(!firstLayoutDone){
        firstLayoutDone=true;
        if(!reduceMotion){requestAnimationFrame(()=>figures.forEach(f=>f.classList.add('gm-animate')));}
      }
    };
    const schedule=()=>requestAnimationFrame(layout);
    figures.forEach(f=>{
      const img=f.querySelector('img');
      const markLoaded=()=>{img.classList.add('gm-loaded');f.classList.add('gm-loaded');};
      if(img.complete&&img.naturalWidth){markLoaded();schedule();}
      else{
        img.addEventListener('load',()=>{markLoaded();schedule();},{once:true});
        img.addEventListener('error',schedule,{once:true});
      }
    });
    let resizeTimer=0;
    const scheduleResize=()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(layout,80);};
    window.addEventListener('resize',scheduleResize,{passive:true});
    if('ResizeObserver'in window)new ResizeObserver(scheduleResize).observe(grid);
    layout();

    const buttons=[...document.querySelectorAll('.photo-button')],box=document.getElementById('lightbox'),img=box.querySelector('.lightbox-full'),previewImg=box.querySelector('.lightbox-preview'),media=box.querySelector('.lightbox-media'),count=box.querySelector('.lightbox-count'),caption=box.querySelector('.lightbox-caption');let i=0,loadToken=0;
    let zoom=1,tx=0,ty=0,startX=0,startY=0,lastDistance=0,startZoom=1,dragging=false;
    const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
    const applyTransform=()=>{const t=`translate3d(${tx}px,${ty}px,0) scale(${zoom})`;img.style.transform=t;previewImg.style.transform=t;};
    const resetZoom=()=>{zoom=1;tx=0;ty=0;lastDistance=0;dragging=false;applyTransform();};
    const imageCache=new Map();
    const cacheImage=(src)=>{if(!src||imageCache.has(src))return imageCache.get(src);const preload=new Image();preload.decoding='async';preload.src=src;imageCache.set(src,preload);return preload;};
    const preloadAround=()=>{
      if(!buttons.length)return;
      [1,-1,2,-2,3,-3].forEach(offset=>{const button=buttons[(i+offset+buttons.length)%buttons.length];if(!button)return;[button.dataset.thumb,button.dataset.medium,button.dataset.full].filter(Boolean).forEach(cacheImage);});
      if(imageCache.size>18){const keep=new Set();[-3,-2,-1,0,1,2,3].forEach(offset=>{const b=buttons[(i+offset+buttons.length)%buttons.length];if(b){if(b.dataset.thumb)keep.add(b.dataset.thumb);if(b.dataset.medium)keep.add(b.dataset.medium);if(b.dataset.full)keep.add(b.dataset.full);}});[...imageCache.keys()].forEach(key=>{if(!keep.has(key))imageCache.delete(key);});}
    };
    const swapLightboxImage=n=>{
      i=(n+buttons.length)%buttons.length;
      const button=buttons[i],thumb=button.dataset.thumb,medium=button.dataset.medium,full=button.dataset.full,token=++loadToken;
      resetZoom();
      media.classList.remove('gm-full-ready');
      media.setAttribute('aria-busy','true');
      previewImg.src=medium||thumb||full;
      img.removeAttribute('src');
      img.fetchPriority='high';
      img.onload=()=>{if(token!==loadToken)return;media.classList.add('gm-full-ready');media.setAttribute('aria-busy','false');};
      img.onerror=()=>{if(token!==loadToken)return;img.onerror=null;if(thumb&&img.src!==thumb)img.src=thumb;media.classList.add('gm-full-ready');media.setAttribute('aria-busy','false');};
      img.src=full;
      count.textContent=`${String(i+1).padStart(2,'0')} / ${String(buttons.length).padStart(2,'0')}`;
      caption.textContent=button.dataset.caption||'';caption.style.display=caption.textContent?'block':'none';
      preloadAround();
    };
    const show=n=>{swapLightboxImage(n);};
    const distance=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
    media.addEventListener('touchstart',e=>{
      if(e.touches.length===2){lastDistance=distance(e.touches);startZoom=zoom;e.preventDefault();return;}
      if(e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY;dragging=zoom>1;}
    },{passive:false});
    media.addEventListener('touchmove',e=>{
      if(e.touches.length===2){const d=distance(e.touches);if(lastDistance>0){zoom=clamp(startZoom*(d/lastDistance),1,5);applyTransform();}e.preventDefault();return;}
      if(e.touches.length===1&&zoom>1){const nx=e.touches[0].clientX,ny=e.touches[0].clientY;tx+=nx-startX;ty+=ny-startY;startX=nx;startY=ny;dragging=true;applyTransform();e.preventDefault();}
    },{passive:false});
    media.addEventListener('touchend',e=>{
      if(e.touches.length<2)lastDistance=0;
      if(!e.touches.length&&zoom<=1.01)resetZoom();
    },{passive:true});
    let swipeStartX=0,swipeStartY=0;
    box.addEventListener('touchstart',e=>{if(e.touches.length===1&&zoom===1){swipeStartX=e.touches[0].clientX;swipeStartY=e.touches[0].clientY;}},{passive:true});
    box.addEventListener('touchend',e=>{if(zoom!==1||dragging||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-swipeStartX,dy=e.changedTouches[0].clientY-swipeStartY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)show(i+(dx<0?1:-1));},{passive:true});
    media.addEventListener('dblclick',()=>{zoom=zoom>1?1:2.5;tx=0;ty=0;applyTransform();});
    const lockPage=()=>{document.documentElement.classList.add('gm-lightbox-open');document.body.classList.add('gm-lightbox-open');};
    const unlockPage=()=>{document.documentElement.classList.remove('gm-lightbox-open');document.body.classList.remove('gm-lightbox-open');};
    let transitionBusy=false;
    const fittedRect=(naturalWidth,naturalHeight,container)=>{
      const nw=Math.max(Number(naturalWidth)||1,1),nh=Math.max(Number(naturalHeight)||1,1);
      const scale=Math.min(container.width/nw,container.height/nh);
      const width=nw*scale,height=nh*scale;
      return {left:container.left+(container.width-width)/2,top:container.top+(container.height-height)/2,width,height};
    };
    const flyImage=(source,target,targetRadius,onDone)=>{
      if(!source||reduceMotion){onDone?.();return;}
      const start=source.getBoundingClientRect();
      if(start.width<2||start.height<2){onDone?.();return;}
      const clone=source.cloneNode(true);
      clone.removeAttribute('loading');
      clone.removeAttribute('srcset');
      clone.className='';
      Object.assign(clone.style,{
        position:'fixed',zIndex:'2147483646',pointerEvents:'none',margin:'0',
        left:`${start.left}px`,top:`${start.top}px`,width:`${start.width}px`,height:`${start.height}px`,
        maxWidth:'none',maxHeight:'none',objectFit:'cover',objectPosition:getComputedStyle(source).objectPosition||'center',
        borderRadius:getComputedStyle(source.closest('.photo')||source).borderRadius||'0px',
        boxShadow:'0 28px 90px rgba(0,0,0,.46)',transform:'translateZ(0)',
        transition:'left .46s cubic-bezier(.2,.8,.2,1),top .46s cubic-bezier(.2,.8,.2,1),width .46s cubic-bezier(.2,.8,.2,1),height .46s cubic-bezier(.2,.8,.2,1),border-radius .4s ease,box-shadow .4s ease'
      });
      document.body.appendChild(clone);
      requestAnimationFrame(()=>requestAnimationFrame(()=>Object.assign(clone.style,{
        left:`${target.left}px`,top:`${target.top}px`,width:`${target.width}px`,height:`${target.height}px`,
        borderRadius:targetRadius||'0px',boxShadow:'0 10px 44px rgba(0,0,0,.22)'
      })));
      window.setTimeout(()=>{clone.remove();onDone?.();},470);
    };
    const animateGalleryEntry=()=>{
      try{
        const expected=sessionStorage.getItem('gm-gallery-entry');
        if(!expected||expected!==location.pathname)return;
        sessionStorage.removeItem('gm-gallery-entry');
        const hero=document.querySelector('.gallery-hero img');
        if(hero&&!reduceMotion)hero.animate([
          {transform:'scale(1.035)',filter:'brightness(.9)',opacity:.88},
          {transform:'scale(1.002)',filter:'brightness(1)',opacity:1}
        ],{duration:560,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});
      }catch(_){}
    };
    animateGalleryEntry();
    const openLightbox=(n,button)=>{
      if(transitionBusy)return;
      const source=button?.querySelector('img');
      show(n);lockPage();box.showModal();
      if(reduceMotion||!source)return;
      const bounds=media.getBoundingClientRect();
      const target=fittedRect(source.naturalWidth||source.width,source.naturalHeight||source.height,bounds);
      media.style.opacity='0';
      transitionBusy=true;
      flyImage(source,target,'0px',()=>{media.style.opacity='1';transitionBusy=false;});
    };
    const requestClose=()=>{
      if(!box.open||transitionBusy)return;
      const button=buttons[i],destination=button?.querySelector('img');
      const active=media.classList.contains('gm-full-ready')&&img.src?img:previewImg;
      if(reduceMotion||!destination||!active||destination.getBoundingClientRect().bottom<0||destination.getBoundingClientRect().top>innerHeight){box.close();return;}
      const target=destination.getBoundingClientRect();
      media.style.opacity='0';
      transitionBusy=true;
      flyImage(active,target,getComputedStyle(destination.closest('.photo')||destination).borderRadius||'6px',()=>{transitionBusy=false;box.close();});
    };
    buttons.forEach((b,n)=>b.addEventListener('click',()=>openLightbox(n,b)));
    box.querySelector('.lightbox-close').onclick=requestClose;
    box.addEventListener('close',()=>{unlockPage();resetZoom();media.style.opacity='';transitionBusy=false;});
    box.addEventListener('cancel',e=>{e.preventDefault();requestClose();});
    box.querySelector('.lightbox-prev').onclick=()=>show(i-1);box.querySelector('.lightbox-next').onclick=()=>show(i+1);
    box.addEventListener('wheel',e=>{if(box.open)e.preventDefault();},{passive:false});
    document.addEventListener('keydown',e=>{if(!box.open)return;if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1);if(e.key==='Escape'){e.preventDefault();requestClose();}});
  })();
  </script>
